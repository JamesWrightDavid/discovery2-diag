name: ci

# The Ostler pack for Land Rover Discovery 2. The platform (openostler) lives in
# https://github.com/openostler/ostler and is installed first; PLATFORM_REF picks the
# platform branch, tag or commit to test against (default: main).

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      platform_ref:
        description: "openostler/ostler ref to test against"
        required: false
        default: main

env:
  PLATFORM_REF: ${{ inputs.platform_ref || vars.PLATFORM_REF || 'main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the platform
        run: pip install "openostler @ git+https://github.com/openostler/ostler@${PLATFORM_REF:-main}"
      - name: Install the pack
        run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Generated files are current
        run: |
          python3 tools/gen_signal_header.py --check
          python3 tools/gen_faultmap.py --check
          python3 tools/gen_fault_docs.py --check

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate frontmatter
        run: python3 skill/scripts/validate_frontmatter.py
      - name: Links and doc paths resolve
        run: python3 skill/scripts/check_links.py
      - name: INDEX.md is up to date
        run: |
          python3 skill/scripts/build_index.py
          # The generated date line changes daily; compare everything else.
          git diff --exit-code -I '^updated: ' -- INDEX.md
