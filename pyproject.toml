[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "d2diag"
version = "0.1.0"
description = "Ostler pack for Land Rover Discovery 2 (Td5, SLABS, BCU, airbag, ACE, EAT)"
readme = "README.md"
requires-python = ">=3.9"
# Code: AGPL-3.0-or-later (LICENSE). Data (signals/, dtc/, faultmaps, demo): CC BY-SA 4.0
# (LICENSE-DATA). See ADR-0012 in the platform repo.
license = { text = "AGPL-3.0-or-later AND CC-BY-SA-4.0" }
# The platform (https://github.com/openostler/ostler). Until it is on PyPI, install it
# first from git: pip install "openostler @ git+https://github.com/openostler/ostler@main"
dependencies = ["openostler", "pyserial>=3.5"]

[project.urls]
Homepage = "https://ostler.tech"
Source = "https://github.com/openostler/ostler-pack-lr-d2"
Platform = "https://github.com/openostler/ostler"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
d2diag = ["layout.json", "signals/*.json", "dtc/*.json", "td5/*.json", "slabs/*.json",
          "demo/*.txt", "demo/sessions/*/*"]

# Vehicle packs (ADR-0013, ADR-0014): the platform resolves its pack through this group.
[project.entry-points."openostler.vehicle"]
lr_d2 = "d2diag:PACK"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
